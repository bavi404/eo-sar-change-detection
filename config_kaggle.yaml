# Replace dataset folder names with your Kaggle input dataset mount names.
data:
  train_root: "/kaggle/input/your-train-dataset/train/train"
  val_root: "/kaggle/input/your-val-dataset/val/val"
  test_root: "/kaggle/input/your-test-dataset/test/test"

dataset:
  concat_diff: true

model:
  architecture: "unetplusplus"
  encoder_name: "resnet34"
  in_channels: 12
  classes: 1
  decoder_attention_type: "scse"

loss:
  type: "bce_dice"
  pos_weight: 5.0

training:
  epochs: 20
  batch_size: 2
  accumulation_steps: 2
  lr: 2.0e-05
  num_workers: 0
  crop_size: 512
  threshold: 0.20
  output_dir: "/kaggle/working/project/models/checkpoints"
  seed: 42

evaluation:
  tune_threshold_on_val: false
  use_tta: true
